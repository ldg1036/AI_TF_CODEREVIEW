name: test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-cov ruff mypy PyYAML openpyxl

      - name: Run lint check
        run: |
          ruff check wincc_reviewer/app

      - name: Run agent protocol and CI integrity checks
        run: |
          python scripts/validate_dataset_authenticity.py intermediate_results/real_samples
          python scripts/16_verify_agent_protocol.py
          python scripts/verify_ci_yaml.py
          python scripts/verify_raw_sample_provenance.py
          python scripts/verify_commit_message_claims.py "${{ github.event.head_commit.message }}"

      - name: Run tests with coverage
        env:
          PYTHONPATH: wincc_reviewer:.
        run: |
          python -m pytest wincc_reviewer/tests/ --cov=wincc_reviewer/app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Update SSOT Metrics
        run: python scripts/verify_coverage_claim.py

      - name: Verify Metric Variance
        run: python scripts/check_metric_variance.py

      - name: Verify SSOT Metrics Staleness
        run: git diff --exit-code intermediate_results/single_source_metrics.json || (echo "[FAIL] single_source_metrics.json is stale. Please run scripts/verify_coverage_claim.py and commit the changes." && exit 1)
