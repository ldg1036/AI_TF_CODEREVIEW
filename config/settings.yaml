app:
  version: 0.1.0
  log_level: INFO
rule_sources:
  client:
    path: config/(코드리뷰결과서-Client) 코드 리뷰 결과서 양식_v2.0_20251201.xlsx
    sheet_name: (클라이언트) 코드 리뷰 결과서
    file_types:
    - pnl
    - xml
  server:
    path: config/(코드리뷰결과서-Server) 코드 리뷰 결과서 양식_v2.0_20251104.xlsx
    sheet_name: (서버) 코드 리뷰 결과서
    file_types:
    - ctl
excel_structure:
  header_row: 17
  data_start_row: 18
  data_columns: B:H
  client_data_rows:
  - 18
  - 32
  server_data_rows:
  - 18
  - 37
ai:
  enabled: true
  provider: local
  timeout_seconds: 300
  max_retries: 3
  local_server:
    host: 127.0.0.1
    port: 11434
    api_key: ''
    endpoint: /v1/chat/completions
    model_id: qwen2.5-coder:3b
autofix:
  enabled: true
winmerge:
  enabled: false
  fallback_to_difflib: true
output:
  default_dir: ./output
  formats:
  - json
  - html
legacy_mapping:
  client: config/legacy_mapping/client.yaml
  server: config/legacy_mapping/server.yaml
