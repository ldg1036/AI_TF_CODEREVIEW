<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinCC OA Code Reviewer UI</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #1e202e;
            --bg-card-hover: #272a3d;
            --border: #2e3248;
            --accent: #7aa2f7;
            --accent-glow: rgba(122, 162, 247, 0.25);
            --text: #c0caf5;
            --subtext: #565f89;
            --c-critical: #f7768e;
            --c-high: #ff9e64;
            --c-medium: #e0af68;
            --c-low: #7aa2f7;
            --c-ok: #9ece6a;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-title h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .badge-ver {
            background: var(--border);
            color: var(--subtext);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Layout */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Controls */
        aside {
            width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(30, 32, 46, 0.5);
        }
        .dropzone:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .dropzone-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .path-display {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--accent);
            word-break: break-all;
            margin-top: 8px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn-btn {
            flex: 1;
            padding: 8px 12px;
            background: var(--border);
            color: var(--text);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .btn-btn:hover { background: var(--bg-card-hover); }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #1a1b26;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }

        /* Main View */
        main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-item {
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--subtext);
            font-size: 0.9rem;
        }
        .tab-item.active {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: bold;
        }

        .view-pane { display: none; }
        .view-pane.active { display: block; }

        /* Iframe viewer */
        iframe {
            width: 100%;
            height: calc(100vh - 180px);
            border: none;
            border-radius: 8px;
            background: white;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: var(--bg-card);
            min-width: 190px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            z-index: 100;
            margin-top: 4px;
        }
        .dropdown-menu a {
            color: var(--text);
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .dropdown-menu a:hover {
            background-color: var(--bg-card-hover);
            color: var(--accent);
        }
        .dropdown-menu.show {
            display: block;
        }

        /* Modal Backdrop & Box */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 92%; max-width: 1100px;
            height: 84vh;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 16px;
            font-family: Consolas, Monaco, monospace; font-size: 0.85rem;
            background: #0f1019; color: var(--text);
            user-select: text;
            -webkit-user-select: text;
        }
        .code-row {
            display: flex; padding: 3px 0; border-radius: 2px;
            user-select: text;
            -webkit-user-select: text;
        }
        .code-row.highlight {
            background: rgba(250, 179, 135, 0.3);
            border-left: 5px solid var(--c-high);
            font-weight: bold;
            color: #fff;
        }
        .line-num {
            width: 55px; text-align: right; padding-right: 14px;
            color: var(--subtext); user-select: none;
            -webkit-user-select: none;
        }
        .line-code {
            white-space: pre-wrap; word-break: break-all; flex: 1;
            user-select: text;
            -webkit-user-select: text;
            cursor: text;
        }

        /* Code Search Bar */
        .search-bar-container {
            display: none;
            align-items: center;
            gap: 8px;
            background: #181a26;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
        }
        .search-input {
            flex: 1;
            background: #0f1019;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent);
        }
        .search-count {
            font-size: 0.8rem;
            color: var(--subtext);
            min-width: 60px;
            text-align: center;
        }
        .search-highlight {
            background-color: rgba(250, 204, 21, 0.45);
            color: #ffffff;
            border-radius: 2px;
            padding: 0 1px;
        }
        .search-highlight.active {
            background-color: #f97316;
            color: #ffffff;
            font-weight: bold;
            outline: 2px solid #ef4444;
            border-radius: 2px;
        }

        /* Loader */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="logo-title">
            <h1>🛡️ WinCC OA Code Reviewer</h1>
            <span class="badge-ver">v0.1.0</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--subtext);">Offline Static Analyzer</div>
    </header>

    <div class="app-body">
        <aside>
            <div class="dropzone" id="dropzone" onclick="openFileDialog('folder')">
                <div class="dropzone-icon">📁</div>
                <div>검사 대상 경로 선택</div>
                <div style="font-size: 0.75rem; color: var(--subtext); margin-top: 4px;">클릭하여 폴더 선택</div>
                <div class="path-display" id="pathDisplay">선택된 경로 없음</div>
            </div>

            <div class="btn-group">
                <button class="btn-btn" onclick="openFileDialog('folder')">📂 폴더 선택</button>
                <button class="btn-btn" onclick="openFileDialog('file')">📄 파일 선택</button>
            </div>

            <div style="font-size: 0.85rem; color: var(--subtext);">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="chkNoAi" checked disabled> AI 리뷰 비활성화 (--no-ai)
                </label>
            </div>

            <button class="btn-action" id="btnStart" onclick="startReview()">⚡ 정적 리뷰 실행</button>
        </aside>

        <main>
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); margin-bottom: 20px;">
                <div class="tabs" style="margin-bottom: 0; border-bottom: none;">
                    <div class="tab-item active" onclick="switchTab('htmlTab', event)">📄 전체 리포트</div>
                    <div class="tab-item" onclick="switchTab('summaryTab', event)">📊 파일별 요약 리포트</div>
                </div>
                <div class="dropdown">
                    <button class="btn-btn" style="background: var(--accent); color: #1a1b26; font-weight: bold; padding: 8px 16px;" onclick="toggleExportMenu(event)">📥 Export 리포트 ▼</button>
                    <div class="dropdown-menu" id="exportMenu">
                        <a onclick="triggerExport('html')">📄 HTML 보고서 (*.html)</a>
                        <a onclick="triggerExport('json')">🔍 JSON 데이터 (*.json)</a>
                        <a onclick="triggerExport('csv')">📊 CSV 엑셀 포맷 (*.csv)</a>
                    </div>
                </div>
            </div>

            <div class="loader-container" id="loader">
                <div class="spinner"></div>
                <div style="margin-top: 16px; font-size: 0.95rem;">WinCC OA 파이프라인 정적 검사 수행 중...</div>
            </div>

            <div class="view-pane active" id="htmlTab">
                <iframe id="reportFrame" src="about:blank"></iframe>
            </div>

            <div class="view-pane" id="summaryTab">
                <div id="summaryContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px;">
                    <div style="color: var(--subtext); padding: 20px;">리뷰를 실행하면 파일별 미흡사항 요약이 표시됩니다.</div>
                </div>
            </div>

    <!-- Modal Popup for Code Viewer -->
    <div id="codeModal" class="modal-backdrop" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <span style="font-size: 1.1rem; font-weight: bold; color: var(--accent);" id="modalTitle">📄 파일 소스 코드 뷰어</span>
                    <span style="font-size: 0.85rem; color: var(--c-medium); margin-left: 10px;" id="modalSubTitle"></span>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn-btn" onclick="toggleSearchBar()" style="padding: 4px 10px; background: var(--border); white-space: nowrap;" title="코드 내 찾기 (Ctrl+F)">🔍 찾기</button>
                    <button class="btn-btn" onclick="closeCodeModal()" style="padding: 4px 12px; background: var(--border); white-space: nowrap;">✕ 닫기</button>
                </div>
            </div>
            <div class="search-bar-container" id="codeSearchBar">
                <input type="text" class="search-input" id="codeSearchInput" placeholder="검색어 입력... (Enter: 다음, Shift+Enter: 이전, Esc: 닫기)" oninput="performSearch()" onkeydown="handleSearchKeyDown(event)">
                <span class="search-count" id="codeSearchCount">0 / 0</span>
                <button class="btn-btn" onclick="navigateSearch(-1)" style="padding: 4px 8px;" title="이전 (Shift+Enter)">▲</button>
                <button class="btn-btn" onclick="navigateSearch(1)" style="padding: 4px 8px;" title="다음 (Enter)">▼</button>
                <button class="btn-btn" onclick="toggleSearchBar(false)" style="padding: 4px 8px;" title="검색창 닫기 (Esc)">✕</button>
            </div>
            <div class="modal-body" id="modalCodeBody">
                <!-- Source Code with Line Numbers -->
            </div>
        </div>
    </div>
        </main>
    </div>

    <script>
        let currentPath = "";

        async function openFileDialog(type) {
            if (window.pywebview && window.pywebview.api) {
                const res = await window.pywebview.api.select_input_path(type);
                if (res && res.selected_path) {
                    currentPath = res.selected_path;
                    document.getElementById('pathDisplay').innerText = currentPath;
                }
            } else {
                alert("pywebview 브리지가 연결되지 않았습니다.");
            }
        }

        async function startReview() {
            if (!currentPath) {
                alert("검사 대상 파일 또는 디렉터리를 먼저 선택해 주세요.");
                return;
            }

            document.getElementById('loader').style.display = 'flex';
            document.getElementById('reportFrame').style.display = 'none';

            try {
                if (window.pywebview && window.pywebview.api) {
                    const res = await window.pywebview.api.run_review(currentPath, {
                        no_ai: document.getElementById('chkNoAi').checked
                    });

                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('reportFrame').style.display = 'block';

                    if (res.success) {
                        // Render HTML
                        const doc = document.getElementById('reportFrame').contentWindow.document;
                        doc.open();
                        doc.write(res.html_content);
                        doc.close();

                        // Render JSON (안전 null 체크)
                        const jsonEl = document.getElementById('jsonViewer');
                        if (jsonEl) {
                            jsonEl.innerText = JSON.stringify(res.report, null, 2);
                        }

                        // Render Summary Tab
                        renderSummaryTab(res.report);
                    } else {
                        alert("리뷰 실행 실패: " + res.error);
                    }
                }
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                alert("실행 오류: " + err);
            }
        }

        function toggleExportMenu(evt) {
            evt.stopPropagation();
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('show');
        }

        window.onclick = function(event) {
            const menu = document.getElementById('exportMenu');
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        };

        async function triggerExport(formatType) {
            const menu = document.getElementById('exportMenu');
            if (menu) menu.classList.remove('show');
            await exportReport(formatType);
        }

        function renderSummaryTab(report) {
            const container = document.getElementById('summaryContainer');
            if (!report || !report.files) return;

            let html = '';
            const fileMap = {};
            report.files.forEach(f => fileMap[f] = []);
            if (report.violations) {
                report.violations.forEach(v => {
                    if (fileMap[v.file_id]) fileMap[v.file_id].push(v);
                });
            }

            Object.keys(fileMap).forEach(fPath => {
                const parts = fPath.split(/[\\/]/);
                const fName = parts[parts.length - 1];
                const vList = fileMap[fPath];
                const fails = vList.filter(v => v.status === 'FAIL').length;
                const manuals = vList.filter(v => v.status === 'MANUAL_REVIEW').length;

                let tableRows = '';
                vList.forEach(v => {
                    const lineStr = v.line_start ? `L${v.line_start}` : '-';
                    const statClass = v.status === 'FAIL' ? 'color: var(--c-critical); font-weight: bold;' : 'color: var(--c-manual);';
                    const sevClass = v.severity === 'Critical' ? 'background: var(--c-critical); color: #111;' :
                                     v.severity === 'High' ? 'background: var(--c-high); color: #111;' :
                                     v.severity === 'Medium' ? 'background: var(--c-medium); color: #111;' : 'background: var(--accent); color: #111;';

                    const lineAttr = v.line_start ? v.line_start : 1;
                    const safePath = fPath.replace(/\\/g, '\\\\');

                    tableRows += `
                    <tr style="cursor: pointer;" onclick="openCodeViewer('${safePath}', ${lineAttr}, '${v.rule_id}')" title="클릭하여 소스 코드의 위반 라인 확인">
                        <td><span style="${statClass}">${v.status}</span></td>
                        <td><span style="display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.75rem; font-weight:bold; ${sevClass}">${v.severity}</span></td>
                        <td><strong style="color: var(--accent);">${v.rule_id}</strong></td>
                        <td style="color: var(--accent); font-weight: bold;">${lineStr} 🔍</td>
                        <td style="font-size:0.85rem;">${v.message}</td>
                    </tr>
                    `;
                });

                if (!tableRows) {
                    tableRows = `<tr><td colspan="5" style="text-align:center; color: var(--accent); padding: 12px;">🎉 지적된 미흡 사항이 없습니다. (정상 통과)</td></tr>`;
                }

                html += `
                <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; grid-column: 1 / -1;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px;">
                        <div>
                            <span style="font-size: 1.1rem; font-weight: bold; color: var(--accent);">📁 {fName}</span>
                            <span style="font-family: monospace; font-size: 0.8rem; color: var(--subtext); margin-left: 12px;">({fPath})</span>
                        </div>
                        <div style="font-size: 0.85rem; background: var(--bg-surface); padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border);">
                            총 미흡/검토: <strong>{vList.length}건</strong> (위반: <span style="color: var(--c-critical);">{fails}</span>, 수동검토: <span style="color: var(--c-manual);">{manuals}</span>)
                        </div>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                        <thead>
                            <tr style="background: var(--bg-surface); color: var(--subtext); text-align: left;">
                                <th style="padding: 8px 12px; width: 90px;">상태</th>
                                <th style="padding: 8px 12px; width: 90px;">심각도</th>
                                <th style="padding: 8px 12px; width: 120px;">Rule ID</th>
                                <th style="padding: 8px 12px; width: 80px;">라인</th>
                                <th style="padding: 8px 12px;">미흡 지적 내용 및 핵심 원인 요약</th>
                            </tr>
                        </thead>
                        <tbody>
                            {tableRows}
                        </tbody>
                    </table>
                </div>
                `.replace('{fName}', fName)
                 .replace('{fPath}', fPath)
                 .replace('{vList.length}', vList.length)
                 .replace('{fails}', fails)
                 .replace('{manuals}', manuals)
                 .replace('{tableRows}', tableRows);
            });

            container.innerHTML = html;
        }

        let rawCodeLines = [];
        let searchMatchesCount = 0;
        let currentMatchIndex = -1;
        let currentTargetLineNo = null;

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function openCodeViewer(filePath, targetLine, ruleId) {
            if (!window.pywebview || !window.pywebview.api) {
                alert("pywebview 브리지가 필요합니다.");
                return;
            }
            const res = await window.pywebview.api.get_file_content(filePath);
            if (!res.success) {
                alert("코드 읽기 실패: " + res.error);
                return;
            }

            const parts = filePath.split(/[\\/]/);
            const fName = parts[parts.length - 1];
            document.getElementById('modalTitle').innerText = `📄 ${fName}`;
            document.getElementById('modalSubTitle').innerText = `[${ruleId}] Target Line: L${targetLine}`;

            rawCodeLines = res.content.split('\n');
            currentTargetLineNo = parseInt(targetLine);

            toggleSearchBar(false);
            renderCodeModalLines();

            document.getElementById('codeModal').style.display = 'flex';

            setTimeout(() => {
                const targetEl = document.getElementById('targetCodeLine');
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 150);
        }

        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
            toggleSearchBar(false);
        }

        function toggleSearchBar(show) {
            const bar = document.getElementById('codeSearchBar');
            const input = document.getElementById('codeSearchInput');
            if (show === undefined) {
                show = bar.style.display === 'none' || bar.style.display === '';
            }
            if (show) {
                bar.style.display = 'flex';
                input.focus();
                input.select();
            } else {
                bar.style.display = 'none';
                input.value = '';
                performSearch();
            }
        }

        function handleSearchKeyDown(evt) {
            if (evt.key === 'Enter') {
                evt.preventDefault();
                if (evt.shiftKey) {
                    navigateSearch(-1);
                } else {
                    navigateSearch(1);
                }
            } else if (evt.key === 'Escape') {
                evt.preventDefault();
                toggleSearchBar(false);
            }
        }

        function performSearch() {
            const keyword = document.getElementById('codeSearchInput').value;
            if (!keyword) {
                searchMatchesCount = 0;
                currentMatchIndex = -1;
                document.getElementById('codeSearchCount').innerText = '0 / 0';
                renderCodeModalLines();
                return;
            }

            searchMatchesCount = 0;
            const lowerKeyword = keyword.toLowerCase();

            rawCodeLines.forEach(line => {
                const lowerLine = line.toLowerCase();
                let startPos = 0;
                while (startPos < lowerLine.length) {
                    const foundPos = lowerLine.indexOf(lowerKeyword, startPos);
                    if (foundPos === -1) break;
                    searchMatchesCount++;
                    startPos = foundPos + Math.max(1, keyword.length);
                }
            });

            if (searchMatchesCount > 0) {
                currentMatchIndex = 0;
                updateSearchUIAndScroll();
            } else {
                currentMatchIndex = -1;
                document.getElementById('codeSearchCount').innerText = '0 / 0';
                renderCodeModalLines();
            }
        }

        function navigateSearch(direction) {
            if (searchMatchesCount === 0) return;
            currentMatchIndex = (currentMatchIndex + direction + searchMatchesCount) % searchMatchesCount;
            updateSearchUIAndScroll();
        }

        function updateSearchUIAndScroll() {
            if (searchMatchesCount === 0 || currentMatchIndex === -1) {
                document.getElementById('codeSearchCount').innerText = '0 / 0';
                renderCodeModalLines();
                return;
            }

            document.getElementById('codeSearchCount').innerText = `${currentMatchIndex + 1} / ${searchMatchesCount}`;
            const keyword = document.getElementById('codeSearchInput').value;
            renderCodeModalLines(keyword, currentMatchIndex);

            setTimeout(() => {
                const activeEl = document.querySelector('.search-highlight.active');
                if (activeEl) {
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 50);
        }

        function renderCodeModalLines(keyword = '', activeIndex = -1) {
            let globalMatchCount = 0;
            let codeHtml = '';
            const lowerKeyword = keyword ? keyword.toLowerCase() : '';

            rawCodeLines.forEach((line, idx) => {
                const lineNo = idx + 1;
                const isHighlight = lineNo === currentTargetLineNo;
                const hlClass = isHighlight ? 'highlight' : '';
                const idAttr = isHighlight ? 'id="targetCodeLine"' : '';

                let formattedLine = '';
                if (lowerKeyword && keyword.length > 0) {
                    const lowerLine = line.toLowerCase();
                    let lastPos = 0;
                    let pos = 0;
                    while ((pos = lowerLine.indexOf(lowerKeyword, lastPos)) !== -1) {
                        formattedLine += escapeHtml(line.substring(lastPos, pos));
                        
                        const isCurrentActive = (globalMatchCount === activeIndex);
                        const markClass = isCurrentActive ? 'search-highlight active' : 'search-highlight';
                        const matchText = line.substring(pos, pos + keyword.length);
                        formattedLine += `<mark class="${markClass}">${escapeHtml(matchText)}</mark>`;
                        
                        globalMatchCount++;
                        lastPos = pos + keyword.length;
                    }
                    formattedLine += escapeHtml(line.substring(lastPos));
                } else {
                    formattedLine = escapeHtml(line);
                }

                codeHtml += `<div class="code-row ${hlClass}" ${idAttr}><span class="line-num">${lineNo}</span><span class="line-code">${formattedLine}</span></div>`;
            });

            document.getElementById('modalCodeBody').innerHTML = codeHtml;
        }

        window.addEventListener('keydown', function(evt) {
            const modal = document.getElementById('codeModal');
            const isModalOpen = modal && modal.style.display !== 'none';

            if ((evt.ctrlKey || evt.metaKey) && evt.key.toLowerCase() === 'f') {
                if (isModalOpen) {
                    evt.preventDefault();
                    toggleSearchBar(true);
                }
            } else if (evt.key === 'Escape') {
                if (isModalOpen) {
                    const bar = document.getElementById('codeSearchBar');
                    if (bar && bar.style.display !== 'none' && bar.style.display !== '') {
                        evt.preventDefault();
                        toggleSearchBar(false);
                    } else {
                        evt.preventDefault();
                        closeCodeModal();
                    }
                }
            }
        });

        async function exportReport(formatType) {
            if (window.pywebview && window.pywebview.api) {
                const res = await window.pywebview.api.export_report(formatType);
                if (res.success) {
                    alert(`${formatType.toUpperCase()} 리포트 내보내기 성공:\n${res.saved_path}`);
                } else if (res.error !== "저장이 취소되었습니다.") {
                    alert("내보내기 실패: " + res.error);
                }
            } else {
                alert("pywebview 브리지가 연결되지 않았습니다.");
            }
        }

        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

            if (evt && evt.target) evt.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
