# WinCC OA 코드 리뷰 자동화 도구 — 설정 파일
# 이 파일은 config/settings.yaml에 위치합니다.

# 앱 기본 설정
app:
  version: "0.1.0"
  log_level: "INFO"

# 코드리뷰 결과서 파일 경로
# 08_ADR_실제_Excel_양식_계약.md 기준
rule_sources:
  client:
    path: "config/(코드리뷰결과서-Client) 코드 리뷰 결과서 양식_v2.0_20251201.xlsx"
    sheet_name: "(클라이언트) 코드 리뷰 결과서"
    file_types: ["pnl", "xml"]
  server:
    path: "config/(코드리뷰결과서-Server) 코드 리뷰 결과서 양식_v2.0_20251104.xlsx"
    sheet_name: "(서버) 코드 리뷰 결과서"
    file_types: ["ctl"]

# Excel 구조 계약 (08_ADR 기준, 변경 시 ADR 갱신 필요)
excel_structure:
  header_row: 17
  data_start_row: 18
  data_columns: "B:H"
  client_data_rows: [18, 32]  # 18~32행, 15개 항목
  server_data_rows: [18, 37]  # 18~37행, 20개 항목

# AI 설정 — BLOCKED (BLOCKED.md 참조)
# 확정 전에는 mock_provider만 사용합니다.
ai:
  enabled: false  # 기본 OFF
  provider: "mock"  # mock | gemma
  timeout_seconds: 60
  max_retries: 3
  # endpoint: BLOCKED — 사내 인프라팀 확인 필요
  # auth_method: BLOCKED — 사내 인프라팀 확인 필요
  # model_id: BLOCKED — 사내 인프라팀 확인 필요

# 자동수정 설정
autofix:
  enabled: false  # 기본 OFF (TRD §5.5)

# WinMerge 설정 — BLOCKED (BLOCKED.md 참조)
winmerge:
  enabled: false
  # executable_path: BLOCKED — 실제 설치 경로 확인 필요
  # cli_options: BLOCKED — 실제 버전의 CLI 옵션 확인 필요
  fallback_to_difflib: true

# 출력 설정
output:
  default_dir: "./output"
  formats: ["json", "html"]

# 레거시 매핑 프로파일 경로
legacy_mapping:
  client: "config/legacy_mapping/client.yaml"
  server: "config/legacy_mapping/server.yaml"
