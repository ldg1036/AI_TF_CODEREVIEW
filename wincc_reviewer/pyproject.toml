[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wincc-reviewer"
version = "0.1.0"
description = "WinCC OA 코드 리뷰 자동화 도구"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    "openpyxl>=3.1,<4",
    "pywebview>=5,<6",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6,<7",
]

[project.scripts]
wincc-reviewer = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app"]
