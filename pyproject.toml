[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wincc-reviewer"
version = "1.1.0"
description = "WinCC OA Code Reviewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "openpyxl",
    "pywebview",
    "httpx",
    "charset-normalizer",
    "jinja2",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyinstaller",
]

[tool.setuptools.packages.find]
where = ["wincc_reviewer"]

[tool.pytest.ini_options]
testpaths = ["wincc_reviewer/tests"]
pythonpath = ["wincc_reviewer"]
addopts = "-v --tb=short"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["BLE001", "G201", "S110", "PIE810", "E501"]
